<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiwuuu — Your business never sleeps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      background: #0a0a0a;
      font-family: 'Inter', system-ui, sans-serif;
      overflow: hidden;
    }
    #root { position: fixed; inset: 0; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- ═══════════════════════════════════════════════════════
       ANIMATIONS — Stage, Sprite, easing helpers
  ══════════════════════════════════════════════════════════ -->
  <script type="text/babel">
// ── Easing functions ─────────────────────────────────────────────────────────
const Easing = {
  linear: (t) => t,
  easeInQuad:    (t) => t * t,
  easeOutQuad:   (t) => t * (2 - t),
  easeInOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),
  easeInCubic:    (t) => t * t * t,
  easeOutCubic:   (t) => (--t) * t * t + 1,
  easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),
  easeInQuart:    (t) => t * t * t * t,
  easeOutQuart:   (t) => 1 - (--t) * t * t * t,
  easeInOutQuart: (t) => (t < 0.5 ? 8 * t * t * t * t : 1 - 8 * (--t) * t * t * t),
  easeInExpo:  (t) => (t === 0 ? 0 : Math.pow(2, 10 * (t - 1))),
  easeOutExpo: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  easeInOutExpo: (t) => {
    if (t === 0) return 0; if (t === 1) return 1;
    if (t < 0.5) return 0.5 * Math.pow(2, 20 * t - 10);
    return 1 - 0.5 * Math.pow(2, -20 * t + 10);
  },
  easeInSine:    (t) => 1 - Math.cos((t * Math.PI) / 2),
  easeOutSine:   (t) => Math.sin((t * Math.PI) / 2),
  easeInOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
  easeOutBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  },
  easeInBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return c3 * t * t * t - c1 * t * t;
  },
  easeInOutBack: (t) => {
    const c1 = 1.70158, c2 = c1 * 1.525;
    return t < 0.5
      ? (Math.pow(2 * t, 2) * ((c2 + 1) * 2 * t - c2)) / 2
      : (Math.pow(2 * t - 2, 2) * ((c2 + 1) * (t * 2 - 2) + c2) + 2) / 2;
  },
  easeOutElastic: (t) => {
    const c4 = (2 * Math.PI) / 3;
    if (t === 0) return 0; if (t === 1) return 1;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
  },
};

const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

function interpolate(input, output, ease = Easing.linear) {
  return (t) => {
    if (t <= input[0]) return output[0];
    if (t >= input[input.length - 1]) return output[output.length - 1];
    for (let i = 0; i < input.length - 1; i++) {
      if (t >= input[i] && t <= input[i + 1]) {
        const span = input[i + 1] - input[i];
        const local = span === 0 ? 0 : (t - input[i]) / span;
        const easeFn = Array.isArray(ease) ? (ease[i] || Easing.linear) : ease;
        return output[i] + (output[i + 1] - output[i]) * easeFn(local);
      }
    }
    return output[output.length - 1];
  };
}

function animate({ from = 0, to = 1, start = 0, end = 1, ease = Easing.easeInOutCubic }) {
  return (t) => {
    if (t <= start) return from;
    if (t >= end) return to;
    const local = (t - start) / (end - start);
    return from + (to - from) * ease(local);
  };
}

const TimelineContext = React.createContext({ time: 0, duration: 10, playing: false });
const useTime = () => React.useContext(TimelineContext).time;
const useTimeline = () => React.useContext(TimelineContext);

const SpriteContext = React.createContext({ localTime: 0, progress: 0, duration: 0 });
const useSprite = () => React.useContext(SpriteContext);

function Sprite({ start = 0, end = Infinity, children, keepMounted = false }) {
  const { time } = useTimeline();
  const visible = time >= start && time <= end;
  if (!visible && !keepMounted) return null;
  const duration = end - start;
  const localTime = Math.max(0, time - start);
  const progress = duration > 0 && isFinite(duration) ? clamp(localTime / duration, 0, 1) : 0;
  const value = { localTime, progress, duration, visible };
  return (
    <SpriteContext.Provider value={value}>
      {typeof children === 'function' ? children(value) : children}
    </SpriteContext.Provider>
  );
}

function TextSprite({ text, x = 0, y = 0, size = 48, color = '#111', font = 'Inter, system-ui, sans-serif',
  weight = 600, entryDur = 0.45, exitDur = 0.35, entryEase = Easing.easeOutBack,
  exitEase = Easing.easeInCubic, align = 'left', letterSpacing = '-0.01em' }) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);
  let opacity = 1, ty = 0;
  if (localTime < entryDur) {
    const t = entryEase(clamp(localTime / entryDur, 0, 1));
    opacity = t; ty = (1 - t) * 16;
  } else if (localTime > exitStart) {
    const t = exitEase(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t; ty = -t * 8;
  }
  const translateX = align === 'center' ? '-50%' : align === 'right' ? '-100%' : '0';
  return (
    <div style={{
      position: 'absolute', left: x, top: y,
      transform: `translate(${translateX}, ${ty}px)`, opacity,
      fontFamily: font, fontSize: size, fontWeight: weight, color, letterSpacing,
      whiteSpace: 'pre', lineHeight: 1.1, willChange: 'transform, opacity',
    }}>{text}</div>
  );
}

function ImageSprite({ src, x = 0, y = 0, width = 400, height = 300, entryDur = 0.6, exitDur = 0.4,
  kenBurns = false, kenBurnsScale = 1.08, radius = 12, fit = 'cover', placeholder = null }) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);
  let opacity = 1, scale = 1;
  if (localTime < entryDur) {
    const t = Easing.easeOutCubic(clamp(localTime / entryDur, 0, 1));
    opacity = t; scale = 0.96 + 0.04 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInCubic(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t; scale = (kenBurns ? kenBurnsScale : 1) + 0.02 * t;
  } else if (kenBurns) {
    const holdSpan = exitStart - entryDur;
    const holdT = holdSpan > 0 ? (localTime - entryDur) / holdSpan : 0;
    scale = 1 + (kenBurnsScale - 1) * holdT;
  }
  const content = placeholder ? (
    <div style={{
      width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: 'repeating-linear-gradient(135deg, #e9e6df 0 10px, #dcd8cf 10px 20px)',
      color: '#6b6458', fontFamily: 'JetBrains Mono, ui-monospace, monospace',
      fontSize: 13, letterSpacing: '0.04em', textTransform: 'uppercase',
    }}>{placeholder.label || 'image'}</div>
  ) : (
    <img src={src} alt="" style={{ width: '100%', height: '100%', objectFit: fit, display: 'block' }} />
  );
  return (
    <div style={{
      position: 'absolute', left: x, top: y, width, height, opacity,
      transform: `scale(${scale})`, transformOrigin: 'center',
      borderRadius: radius, overflow: 'hidden', willChange: 'transform, opacity',
    }}>{content}</div>
  );
}

function RectSprite({ x = 0, y = 0, width = 100, height = 100, color = '#111', radius = 8,
  entryDur = 0.4, exitDur = 0.3, render }) {
  const spriteCtx = useSprite();
  const { localTime, duration } = spriteCtx;
  const exitStart = Math.max(0, duration - exitDur);
  let opacity = 1, scale = 1;
  if (localTime < entryDur) {
    const t = Easing.easeOutBack(clamp(localTime / entryDur, 0, 1));
    opacity = clamp(localTime / entryDur, 0, 1); scale = 0.4 + 0.6 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInQuad(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t; scale = 1 - 0.15 * t;
  }
  const overrides = render ? render(spriteCtx) : {};
  return (
    <div style={{
      position: 'absolute', left: x, top: y, width, height, background: color, borderRadius: radius,
      opacity, transform: `scale(${scale})`, transformOrigin: 'center',
      willChange: 'transform, opacity', ...overrides,
    }} />
  );
}

function IconButton({ children, onClick, title }) {
  const [hover, setHover] = React.useState(false);
  return (
    <button onClick={onClick} title={title}
      onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{
        width: 28, height: 28, display: 'flex', alignItems: 'center', justifyContent: 'center',
        background: hover ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)',
        border: '1px solid rgba(255,255,255,0.1)', borderRadius: 6,
        color: '#f6f4ef', cursor: 'pointer', padding: 0, transition: 'background 120ms',
      }}>
      {children}
    </button>
  );
}

function PlaybackBar({ time, duration, playing, onPlayPause, onReset, onSeek, onHover }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const timeFromEvent = React.useCallback((e) => {
    const rect = trackRef.current.getBoundingClientRect();
    const x = clamp((e.clientX - rect.left) / rect.width, 0, 1);
    return x * duration;
  }, [duration]);
  const onTrackMove = (e) => {
    if (!trackRef.current) return;
    const t = timeFromEvent(e);
    if (dragging) onSeek(t); else onHover(t);
  };
  const onTrackLeave = () => { if (!dragging) onHover(null); };
  const onTrackDown = (e) => { setDragging(true); onSeek(timeFromEvent(e)); onHover(null); };
  React.useEffect(() => {
    if (!dragging) return;
    const onUp = () => setDragging(false);
    const onMove = (e) => { if (trackRef.current) onSeek(timeFromEvent(e)); };
    window.addEventListener('mouseup', onUp);
    window.addEventListener('mousemove', onMove);
    return () => { window.removeEventListener('mouseup', onUp); window.removeEventListener('mousemove', onMove); };
  }, [dragging, timeFromEvent, onSeek]);
  const pct = duration > 0 ? (time / duration) * 100 : 0;
  const fmt = (t) => {
    const total = Math.max(0, t);
    const m = Math.floor(total / 60);
    const s = Math.floor(total % 60);
    const cs = Math.floor((total * 100) % 100);
    return `${String(m).padStart(1, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
  };
  const mono = 'JetBrains Mono, ui-monospace, SFMono-Regular, monospace';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 12, padding: '8px 16px',
      background: 'rgba(20,20,20,0.92)', borderTop: '1px solid rgba(255,255,255,0.08)',
      width: '100%', maxWidth: 680, alignSelf: 'center', borderRadius: 8,
      color: '#f6f4ef', fontFamily: 'Inter, system-ui, sans-serif', userSelect: 'none', flexShrink: 0,
    }}>
      <IconButton onClick={onReset} title="Return to start (0)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
        </svg>
      </IconButton>
      <IconButton onClick={onPlayPause} title="Play/pause (space)">
        {playing ? (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="3" y="2" width="3" height="10" fill="currentColor"/>
            <rect x="8" y="2" width="3" height="10" fill="currentColor"/>
          </svg>
        ) : (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 2l9 5-9 5V2z" fill="currentColor"/>
          </svg>
        )}
      </IconButton>
      <div style={{ fontFamily: mono, fontSize: 12, fontVariantNumeric: 'tabular-nums', width: 64, textAlign: 'right', color: '#f6f4ef' }}>
        {fmt(time)}
      </div>
      <div ref={trackRef} onMouseMove={onTrackMove} onMouseLeave={onTrackLeave} onMouseDown={onTrackDown}
        style={{ flex: 1, height: 22, position: 'relative', cursor: 'pointer', display: 'flex', alignItems: 'center' }}>
        <div style={{ position: 'absolute', left: 0, right: 0, height: 4, background: 'rgba(255,255,255,0.12)', borderRadius: 2 }}/>
        <div style={{ position: 'absolute', left: 0, width: `${pct}%`, height: 4, background: 'oklch(72% 0.12 250)', borderRadius: 2 }}/>
        <div style={{ position: 'absolute', left: `${pct}%`, top: '50%', width: 12, height: 12, marginLeft: -6, marginTop: -6, background: '#fff', borderRadius: 6, boxShadow: '0 2px 4px rgba(0,0,0,0.4)' }}/>
      </div>
      <div style={{ fontFamily: mono, fontSize: 12, fontVariantNumeric: 'tabular-nums', width: 64, textAlign: 'left', color: 'rgba(246,244,239,0.55)' }}>
        {fmt(duration)}
      </div>
    </div>
  );
}

function Stage({ width = 1280, height = 720, duration = 10, background = '#f6f4ef',
  loop = true, autoplay = true, persistKey = 'animstage', children }) {
  const [time, setTime] = React.useState(() => {
    try {
      const v = parseFloat(localStorage.getItem(persistKey + ':t') || '0');
      return isFinite(v) ? clamp(v, 0, duration) : 0;
    } catch { return 0; }
  });
  const [playing, setPlaying] = React.useState(autoplay);
  const [hoverTime, setHoverTime] = React.useState(null);
  const [scale, setScale] = React.useState(1);
  const stageRef = React.useRef(null);
  const canvasRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const lastTsRef = React.useRef(null);

  React.useEffect(() => {
    try { localStorage.setItem(persistKey + ':t', String(time)); } catch {}
  }, [time, persistKey]);

  React.useEffect(() => {
    if (!stageRef.current) return;
    const el = stageRef.current;
    const measure = () => {
      const barH = 44;
      const s = Math.min(el.clientWidth / width, (el.clientHeight - barH) / height);
      setScale(Math.max(0.05, s));
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    window.addEventListener('resize', measure);
    return () => { ro.disconnect(); window.removeEventListener('resize', measure); };
  }, [width, height]);

  React.useEffect(() => {
    if (!playing) { lastTsRef.current = null; return; }
    const step = (ts) => {
      if (lastTsRef.current == null) lastTsRef.current = ts;
      const dt = (ts - lastTsRef.current) / 1000;
      lastTsRef.current = ts;
      setTime((t) => {
        let next = t + dt;
        if (next >= duration) {
          if (loop) next = next % duration;
          else { next = duration; setPlaying(false); }
        }
        return next;
      });
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      lastTsRef.current = null;
    };
  }, [playing, duration, loop]);

  React.useEffect(() => {
    const onKey = (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Space') { e.preventDefault(); setPlaying(p => !p); }
      else if (e.code === 'ArrowLeft') setTime(t => clamp(t - (e.shiftKey ? 1 : 0.1), 0, duration));
      else if (e.code === 'ArrowRight') setTime(t => clamp(t + (e.shiftKey ? 1 : 0.1), 0, duration));
      else if (e.key === '0' || e.code === 'Home') setTime(0);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [duration]);

  const displayTime = hoverTime != null ? hoverTime : time;
  const ctxValue = React.useMemo(
    () => ({ time: displayTime, duration, playing, setTime, setPlaying }),
    [displayTime, duration, playing]
  );

  return (
    <div ref={stageRef} style={{
      position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column',
      alignItems: 'center', background: '#0a0a0a', fontFamily: 'Inter, system-ui, sans-serif',
    }}>
      <div style={{ flex: 1, width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', minHeight: 0 }}>
        <div ref={canvasRef} style={{
          width, height, background, position: 'relative',
          transform: `scale(${scale})`, transformOrigin: 'center', flexShrink: 0,
          boxShadow: '0 20px 60px rgba(0,0,0,0.4)', overflow: 'hidden',
        }}>
          <TimelineContext.Provider value={ctxValue}>
            {children}
          </TimelineContext.Provider>
        </div>
      </div>
      <PlaybackBar
        time={displayTime} actualTime={time} duration={duration} playing={playing}
        onPlayPause={() => setPlaying(p => !p)}
        onReset={() => setTime(0)}
        onSeek={(t) => setTime(t)}
        onHover={(t) => setHoverTime(t)}
      />
    </div>
  );
}

Object.assign(window, {
  Easing, interpolate, animate, clamp,
  TimelineContext, useTime, useTimeline,
  Sprite, SpriteContext, useSprite,
  TextSprite, ImageSprite, RectSprite,
  Stage, PlaybackBar,
});
  </script>

  <!-- ═══════════════════════════════════════════════════════
       PHONE — frame, chat primitives, cursor
  ══════════════════════════════════════════════════════════ -->
  <script type="text/babel">
const KIWI = {
  bg: 'oklch(97% 0.012 80)',
  ink: 'oklch(22% 0.01 60)',
  ink2: 'oklch(45% 0.01 60)',
  muted: 'oklch(88% 0.008 80)',
  green: 'oklch(62% 0.13 155)',
  greenSoft: 'oklch(94% 0.04 155)',
  peach: 'oklch(88% 0.05 45)',
  peachInk: 'oklch(30% 0.04 40)',
  night: 'oklch(18% 0.02 260)',
  nightFg: 'oklch(92% 0.01 80)',
  dawn1: 'oklch(75% 0.08 55)',
  dawn2: 'oklch(88% 0.06 80)',
};

function PhoneFrame({ x, y, width = 420, height = 860, children, glow = false }) {
  const bezel = 12;
  return (
    <div style={{
      position: 'absolute', left: x, top: y, width, height,
      background: '#0a0a0a', borderRadius: 56, padding: bezel,
      boxShadow: glow
        ? '0 0 0 1px rgba(255,255,255,0.06), 0 40px 100px rgba(0,0,0,0.35), 0 10px 30px rgba(0,0,0,0.25)'
        : '0 0 0 1px rgba(0,0,0,0.08), 0 30px 80px rgba(0,0,0,0.22), 0 8px 20px rgba(0,0,0,0.14)',
    }}>
      <div style={{ position: 'relative', width: '100%', height: '100%', borderRadius: 44, overflow: 'hidden', background: KIWI.bg }}>
        {children}
        <div style={{
          position: 'absolute', top: 14, left: '50%', transform: 'translateX(-50%)',
          width: 120, height: 30, background: '#0a0a0a', borderRadius: 999, zIndex: 10,
        }}/>
      </div>
    </div>
  );
}

function StatusBar({ time = '23:00', dark = false }) {
  const fg = dark ? KIWI.nightFg : KIWI.ink;
  return (
    <div style={{
      position: 'absolute', top: 18, left: 0, right: 0,
      display: 'flex', justifyContent: 'space-between', padding: '0 36px',
      fontFamily: 'Inter, system-ui, sans-serif', fontSize: 16, fontWeight: 600,
      color: fg, zIndex: 11, fontVariantNumeric: 'tabular-nums',
    }}>
      <span style={{ letterSpacing: '-0.02em' }}>{time}</span>
      <div style={{ width: 120 }}/>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
        <svg width="18" height="11" viewBox="0 0 18 11" fill="none">
          <rect x="0" y="7" width="3" height="4" rx="0.5" fill={fg}/>
          <rect x="5" y="5" width="3" height="6" rx="0.5" fill={fg}/>
          <rect x="10" y="2" width="3" height="9" rx="0.5" fill={fg}/>
          <rect x="15" y="0" width="3" height="11" rx="0.5" fill={fg} opacity="0.35"/>
        </svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none">
          <rect x="0.5" y="0.5" width="22" height="11" rx="3" stroke={fg} opacity="0.5"/>
          <rect x="2" y="2" width="18" height="8" rx="1.5" fill={fg}/>
          <rect x="24" y="4" width="1.5" height="4" rx="0.75" fill={fg} opacity="0.5"/>
        </svg>
      </div>
    </div>
  );
}

function ChatHeader({ clinic = 'Dr. Mira Dental', subtitle = 'Kiwuuu AI · online' }) {
  return (
    <div style={{
      position: 'absolute', top: 58, left: 0, right: 0, padding: '18px 24px',
      display: 'flex', alignItems: 'center', gap: 14,
      borderBottom: `1px solid ${KIWI.muted}`, background: KIWI.bg, zIndex: 5,
    }}>
      <div style={{
        width: 44, height: 44, borderRadius: 22, background: KIWI.greenSoft,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontFamily: 'Inter', fontWeight: 700, fontSize: 18,
        color: KIWI.green, border: `1.5px solid ${KIWI.green}`,
      }}>D</div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontFamily: 'Inter', fontWeight: 600, fontSize: 17, color: KIWI.ink, letterSpacing: '-0.01em' }}>{clinic}</div>

                  boxShadow: s.isEmergency ? 'none' : '0 1px 2px rgba(0,0,0,0.03)',
                }}>
                  <div style={{
                    fontFamily: 'Inter', fontSize: 15, fontWeight: 700,
                    color: s.isEmergency ? KIWI.green : KIWI.ink,
                    letterSpacing: '-0.01em', width: 54, fontVariantNumeric: 'tabular-nums',
                  }}>{s.time}</div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontFamily: 'Inter', fontSize: 15, fontWeight: 600, color: KIWI.ink, letterSpacing: '-0.01em' }}>{s.name}</div>
                    {s.isEmergency && (
                      <div style={{ fontFamily: 'Inter', fontSize: 12, color: KIWI.green, fontWeight: 600, marginTop: 2 }}>
                        Booked by Kiwuuu · 23:01 Sat
                      </div>
                    )}
                  </div>
                  {s.isEmergency && <div style={{ width: 8, height: 8, borderRadius: 4, background: KIWI.green }}/>}
                </div>
              );
            })}
          </div>
        </PhoneFrame>
      </div>
    </>
  );
}

function Scene6Tagline() {
  const t = useTime();
  if (t < T.s6_start - 0.1) return null;
  const inP = ss(t, T.s6_start, T.s6_start + 0.5);
  return (
    <>
      <div style={{ position: 'absolute', inset: 0, background: 'oklch(97% 0.012 80 / 0.82)', opacity: inP, pointerEvents: 'none' }}/>
      <div style={{
        position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column',
        alignItems: 'center', justifyContent: 'center',
        opacity: inP, transform: `translateY(${(1 - inP) * 10}px)`,
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 18, marginBottom: 28 }}>
          <div style={{
            width: 72, height: 72, borderRadius: 36, background: KIWI.green,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            color: '#fff', fontFamily: 'Inter', fontSize: 38, fontWeight: 700, letterSpacing: '-0.04em',
          }}>k</div>
          <div style={{ fontFamily: 'Inter', fontSize: 80, fontWeight: 700, color: KIWI.ink, letterSpacing: '-0.04em' }}>kiwuuu</div>
        </div>
        <div style={{ fontFamily: 'Inter', fontSize: 44, fontWeight: 500, color: KIWI.ink, letterSpacing: '-0.02em', textAlign: 'center' }}>
          Your business never sleeps.
        </div>
        <div style={{ marginTop: 24, fontFamily: 'Inter', fontSize: 17, fontWeight: 500, color: KIWI.ink2, letterSpacing: '0.02em' }}>
          AI reception for clinics · on WhatsApp · 24/7
        </div>
      </div>
    </>
  );
}

Object.assign(window, { T, ss, ChatScene, Scene5Morning, Scene6Tagline });
  </script>

  <!-- ═══════════════════════════════════════════════════════
       APP entry point
  ══════════════════════════════════════════════════════════ -->
  <script type="text/babel">
function App() {
  const [label, setLabel] = React.useState('0.0s');
  return (
    <div data-screen-label={label}>
      <Stage width={1920} height={1080} duration={15} background="oklch(97% 0.012 80)" persistKey="kiwuuu-video">
        <LabelTicker onTick={setLabel}/>
        <ChatScene/>
        <Scene5Morning/>
        <Scene6Tagline/>
      </Stage>
    </div>
  );
}

function LabelTicker({ onTick }) {
  const t = useTime();
  const sec = Math.floor(t);
  React.useEffect(() => { onTick(`${sec}.0s`); }, [sec, onTick]);
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
